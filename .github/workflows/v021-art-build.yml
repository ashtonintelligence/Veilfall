name: Verify Veilfall v0.2.10 save-load hotfix

on:
  push:
    branches: [veilfall-v0.2.10-save-load-hotfix, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veilfall-v0210-${{ github.ref }}
  cancel-in-progress: false

jobs:
  art-and-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned Pillow
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify preserved art and adversarial checks
        run: |
          python3 tools/v029/build_assets.py --check
          python3 tools/v029/test_verification.py
          python3 tools/v0210/verify_hotfix.py
          git diff --exit-code

  unciv-save-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: yairm210/Unciv
          ref: 3318515bfca2609a9edb127b59cfadbab6d58d38
          path: unciv
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            unciv/**/*.gradle.kts
            unciv/gradle/libs.versions.toml
            unciv/gradle/wrapper/gradle-wrapper.properties
      - name: Prepare exact predecessor and runtime test
        run: |
          mkdir baseline
          git -C candidate archive 75331685057bcdb676c72a1a622c93912ed2c096 | tar -x -C baseline
          cp candidate/tools/v0210/VeilfallSaveLoadTest.kt unciv/tests/src/com/unciv/logic/
      - name: Run Unciv 4.22.4 ruleset validation and save-load regression
        working-directory: unciv
        env:
          VEILFALL_BASELINE: ${{ github.workspace }}/baseline
          VEILFALL_CANDIDATE: ${{ github.workspace }}/candidate
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :tests:test --tests com.unciv.logic.VeilfallSaveLoadTest --no-daemon --max-workers=2
      - name: Retain actual runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veilfall-v0210-runtime-${{ github.sha }}
          path: |
            unciv/tests/build/test-results/test/
            unciv/tests/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 30
