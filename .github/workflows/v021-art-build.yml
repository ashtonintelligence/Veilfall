name: Stage Veilfall v0.2.6 build inputs

on:
  push:
    branches: [veilfall-v0.2.6-portrait-cleanup]
    paths: ['.github/workflows/v021-art-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Snapshot predecessor and current build sources
        shell: bash
        run: |
          set -euo pipefail
          git archive cd377c5a2ef04c9447656673e06c6a9fc4d47a97 -o /tmp/veilfall-v025-baseline.zip
          sha256sum /tmp/veilfall-v025-baseline.zip
      - name: Retain build inputs for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veilfall-v025-baseline
          path: /tmp/veilfall-v025-baseline.zip
          retention-days: 7
          if-no-files-found: error
